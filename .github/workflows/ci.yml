name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only — no deploy/CD. A push to main triggers the Coolify production
# build out-of-band via its own webhook; this workflow never deploys.
permissions:
  contents: read

jobs:
  server:
    name: server (typecheck · lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Generate Prisma client
        run: npx prisma generate
      # The shipped 0_init migration must still create exactly what schema.prisma
      # describes (new projects get their tables from it; no database needed).
      - name: Init migration matches schema
        run: node ../../scripts/check-init-migration.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test

  client:
    name: client (typecheck · lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # Generates a project exactly as a user would (both variants: plain, and with
  # the email-verification module patched in), then runs the generated
  # project's own gate on it: install from its shipped lockfiles, typecheck,
  # lint, unit tests with coverage, build, integration tests against real
  # MySQL + Redis (Testcontainers), and the client build. The template jobs
  # above check template/ directly; this one checks what users get.
  cli-smoke:
    name: cli-smoke (${{ matrix.variant }}) - scaffold, install, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: plain
            answer: '\n'
          - variant: email
            answer: '1\n'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install CLI dependencies
        run: npm ci
      - name: CLI --help
        run: node bin/create-tigra.js --help
      - name: Assert npm package includes Codex guidance
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/npm-pack.json"
          PACK_JSON="$RUNNER_TEMP/npm-pack.json" node --input-type=module -e '
            import fs from "node:fs";
            const [pack] = JSON.parse(fs.readFileSync(process.env.PACK_JSON, "utf8"));
            const files = new Set(pack.files.map(({ path }) => path));
            const required = [
              "template/.github/workflows/ci.yml",
              "template/.github/workflows/audit.yml",
              "template/.github/dependabot.yml",
              "template/AGENTS.md",
              "template/client/AGENTS.md",
              "template/server/AGENTS.md",
              "template/.agents/skills/security-audit/SKILL.md",
              "template/.agents/skills/security-audit/LICENSE",
            ];
            const missing = required.filter((path) => !files.has(path));
            if (missing.length > 0) throw new Error(`npm package is missing: ${missing.join(", ")}`);
          '
      - name: Scaffold a smoke app non-interactively (${{ matrix.variant }})
        run: |
          # The CLI exits 1 if the email-verification prompt is abandoned on a
          # closed stdin, so we MUST pipe an answer: a single newline takes the
          # default (No, plain), "1" adds the email-verification module.
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          printf '${{ matrix.answer }}' | node "$GITHUB_WORKSPACE/bin/create-tigra.js" ci-smoke
          echo "SMOKE_APP=$smoke_dir/ci-smoke" >> "$GITHUB_ENV"
      - name: Assert generated app includes Codex guidance
        run: |
          app="$SMOKE_APP"
          test -f "$app/AGENTS.md"
          test -f "$app/client/AGENTS.md"
          test -f "$app/server/AGENTS.md"
          test -f "$app/.agents/skills/security-audit/SKILL.md"
          test -f "$app/.agents/skills/security-audit/LICENSE"
      - name: Assert root-scoped font variables are installed on html
        run: |
          layout="$SMOKE_APP/client/src/app/layout.tsx"
          # The :root font preset cannot resolve next/font variables introduced
          # only on body, so guard the generated element placement explicitly.
          grep -Fq 'className={`${inter.variable} ${jetbrainsMono.variable}`}' "$layout"
          grep -Fq '<body className="font-sans antialiased">' "$layout"
          if grep -Eq '<body[^>]*\.variable' "$layout"; then
            echo "::error::next/font variable classes must be applied to html, not body"
            exit 1
          fi
      - name: Assert .env.example keeps the JWT placeholder (never the real secret)
        run: |
          app="$SMOKE_APP"
          grep -q 'CHANGE_ME_generate_with_openssl_rand_hex_48' "$app/server/.env.example" \
            || { echo "::error::server/.env.example lost the CHANGE_ME JWT placeholder"; exit 1; }
      - name: Assert .env.example.production secrets are CHANGE_ME example text
        # Example secrets must start with CHANGE_ME so the server's boot guard
        # (src/config/env.ts) refuses them. A realistic-looking value would boot
        # with a publicly known signing key if someone copied the file as-is.
        run: |
          file="$SMOKE_APP/server/.env.example.production"
          for key in JWT_SECRET COOKIE_SECRET RESEND_API_KEY; do
            grep -Eq "^${key}=\"?CHANGE_ME" "$file" \
              || { echo "::error::$key in server/.env.example.production must be CHANGE_ME example text"; exit 1; }
          done
      - name: Assert .env got a real 96-char hex JWT secret
        run: |
          app="$SMOKE_APP"
          secret="$(sed -nE 's/^JWT_SECRET="?([a-f0-9]+)"?\s*$/\1/p' "$app/server/.env")"
          len="${#secret}"
          echo "Generated JWT_SECRET length: $len"
          [ "$len" -eq 96 ] \
            || { echo "::error::server/.env JWT_SECRET is not a 96-char hex string (got len=$len)"; exit 1; }
      - name: Assert no template placeholders survived the scaffold
        run: |
          app="$SMOKE_APP"
          if grep -rEl '\{\{(PROJECT_NAME|PROJECT_NAME_SNAKE|PROJECT_DISPLAY_NAME|DATABASE_NAME|JWT_SECRET|MYSQL_PORT|PHPMYADMIN_PORT|REDIS_PORT|REDIS_COMMANDER_PORT)\}\}' "$app"; then
            echo "::error::unreplaced {{TEMPLATE}} placeholders remain in the scaffold"
            exit 1
          fi
          echo "No unreplaced placeholders found."
      - name: Assert the generated app ships its CI, audit and Dependabot files
        run: |
          app="$SMOKE_APP"
          test -f "$app/.github/workflows/ci.yml"
          test -f "$app/.github/workflows/audit.yml"
          test -f "$app/.github/dependabot.yml"
      - name: Assert the email module ships its integration tests
        if: matrix.variant == 'email'
        run: test -f "$SMOKE_APP/server/src/modules/auth/__tests__/verification.integration.test.ts"
      - name: Install both apps from their shipped lockfiles, unchanged
        run: |
          for app in server client; do
            before="$(sha256sum "$SMOKE_APP/$app/package-lock.json")"
            (cd "$SMOKE_APP/$app" && npm ci --include=optional)
            after="$(sha256sum "$SMOKE_APP/$app/package-lock.json")"
            [ "$before" = "$after" ] || { echo "::error::$app/package-lock.json changed during npm ci"; exit 1; }
          done
      - name: Server - prisma generate, typecheck, lint, unit tests with coverage, build
        run: |
          cd "$SMOKE_APP/server"
          npx prisma generate
          npm run typecheck
          npm run lint
          npm run test:coverage
          npm run build
      - name: Server - integration tests (Testcontainers MySQL + Redis)
        run: |
          cd "$SMOKE_APP/server"
          npm run test:integration
      - name: Client - typecheck, lint, build
        run: |
          cd "$SMOKE_APP/client"
          npm run typecheck
          npm run lint
          npm run build
