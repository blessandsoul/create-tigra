# Dependabot for create-tigra itself, security updates only: a pull request
# when a dependency of the CLI or of the template's apps has a known
# vulnerability with a fix; no routine version bumps (open-pull-requests-limit: 0
# turns those off). Turned on in the repository's Settings -> Advanced
# Security -> Dependabot security updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /template/server
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /template/client
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
